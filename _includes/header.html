<header class="navbar navbar-expand-md fixed-top docs-nav" data-bs-theme="dark" role="banner">
  <div class="container">
    {% if page.layout == 'post' %}
    <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
    {% endif %}
    <button class="btn toc-toggle" id="toc-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#table-of-contents" aria-controls="table-of-contents" aria-expanded="false" hidden>
      <span class="fa fa-list-ul" aria-hidden="true"></span> 目录
    </button>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" aria-label="展开或收起导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="main-navigation" aria-label="主导航">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{{ '/'  }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ '/categories/' }}">Category</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ '/tag/'  }}">Tag</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ '/friends' }}">Friends</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <button class="nav-link dropdown-toggle" id="about-menu-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">关于</button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="about-menu-toggle" data-bs-theme="light">
            <li><a class="dropdown-item" rel="nofollow noopener noreferrer" target="_blank" href="{{site.github}}">Github</a></li>
            <li><a class="dropdown-item" rel="nofollow noopener noreferrer" target="_blank" href="{{site.twitter}}">Twitter</a></li>
            <li><a class="dropdown-item" href="{{ '/feed.xml'  }}">RSS订阅</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </div>
</header>

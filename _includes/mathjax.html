<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    extensions: ["tex2jax.js"],
    jax: ["input/TeX", "output/HTML-CSS"],
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      displayMath: [ ['$$','$$'], ["\[","\]"], ["\\[","\\]"] ],
      processEscapes: true
    },
    messageStyle: "none",
    "HTML-CSS": { availableFonts: ["TeX"] }
  });

  MathJax.Hub.Register.MessageHook("End Math", function () {
    document.dispatchEvent(new Event('blog:math-typeset'));
  });
  MathJax.Hub.Register.StartupHook("End", function () {
    document.dispatchEvent(new Event('blog:math-typeset'));
  });
  MathJax.Hub.Register.StartupHook("MathZoom Ready", function () {
    document.dispatchEvent(new Event('blog:math-zoom-ready'));
  });
  MathJax.Hub.Register.MessageHook("math unzoomed", function () {
    document.dispatchEvent(new Event('blog:math-unzoomed'));
  });
</script>

        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML">

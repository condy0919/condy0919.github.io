---
layout: default
---
{% capture toc_content %}{% include lefttree.html %}{% endcapture %}
{% include toc.html content=toc_content %}

<main class="container docs-container">
  <div class="docs-content">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="meta">Posted on <span class="postdate">{{ page.date | date: "%b %d, %Y" }}</span> By <a href="{{site.url}}">{{ site.author }}</a></div>
    </header>
    <article class="post-content">
      {{ content }}
    </article>
  </div>
  {% include disqus.html %}
</main>
